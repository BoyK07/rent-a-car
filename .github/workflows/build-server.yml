name: Build Server

on:
  workflow_dispatch:

jobs:
  build-server:
    name: Build Server JAR
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./app/gradlew

      - name: Build server JAR
        run: |
          cd app
          ./gradlew :server:build --no-daemon --stacktrace

      - name: Build fat JAR
        run: |
          cd app
          ./gradlew :server:buildFatJar --no-daemon --stacktrace

      - name: Upload server JAR
        uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: app/modules/server/build/libs/*.jar
          retention-days: 30
