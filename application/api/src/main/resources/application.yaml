ktor:
  application:
    modules:
      - dev.koenv.rentmycar.ApplicationKt.module
  deployment:
    port: 8080
  development: true

jwt:
  domain: "https://jwt-provider-domain/"
  audience: "jwt-audience"
  realm: "ktor sample app"

db:
  type: sqlite        # mysql | sqlite | h2
  host: localhost
  port: 3306
  name: rentmycar
  user: root
  password: password
  file: ./build/db/rentmycar.db  # used for sqlite
